<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1929" />
      <stop offset="50%" stop-color="#1a1f3a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Outer border with gradient -->
  <rect x="4" y="4" width="248" height="248" rx="52" fill="url(#borderGrad)" />
  
  <!-- Inner dark background -->
  <rect x="12" y="12" width="232" height="232" rx="44" fill="url(#bgGrad)" />
  
  <!-- Scale of Justice Icon -->
  <g transform="translate(128, 128)">
    <!-- Center pillar -->
    <rect x="-5" y="-45" width="10" height="85" rx="5" fill="url(#iconGrad)" />
    
    <!-- Base -->
    <rect x="-30" y="35" width="60" height="10" rx="5" fill="url(#iconGrad)" />
    
    <!-- Top bar (balance beam) -->
    <rect x="-50" y="-52" width="100" height="8" rx="4" fill="url(#iconGrad)" />
    
    <!-- Left scale pan -->
    <path d="M-50 -44 L-50 -10 Q-50 0 -40 0 L-25 0 Q-15 0 -15 -10 L-15 -44" stroke="url(#iconGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right scale pan -->
    <path d="M15 -44 L15 -10 Q15 0 25 0 L40 0 Q50 0 50 -10 L50 -44" stroke="url(#iconGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Left chain -->
    <line x1="-50" y1="-50" x2="-50" y2="-44" stroke="url(#iconGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-15" y1="-50" x2="-15" y2="-44" stroke="url(#iconGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Right chain -->
    <line x1="15" y1="-50" x2="15" y2="-44" stroke="url(#iconGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="-50" x2="50" y2="-44" stroke="url(#iconGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>