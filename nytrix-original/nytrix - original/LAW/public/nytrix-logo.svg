<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nytrixMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#4F46E5" />
    </linearGradient>
    <linearGradient id="nytrixTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="50%" stopColor="#3B82F6" />
      <stop offset="100%" stopColor="#4F46E5" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="#0F172A" />
  
  <!-- Main Circle Glow -->
  <circle cx="128" cy="80" r="120" fill="url(#nytrixMainGrad)" opacity="0.08" />
  
  <!-- "N" Letter Design - Modern Tech Style -->
  <g>
    <!-- Left vertical line -->
    <line x1="60" y1="40" x2="60" y2="160" stroke="#10B981" strokeWidth="14" strokeLinecap="round" strokeLinejoin="round" />
    <!-- Diagonal line with gradient effect -->
    <line x1="60" y1="40" x2="180" y2="160" stroke="url(#nytrixMainGrad)" strokeWidth="14" strokeLinecap="round" strokeLinejoin="round" />
    <!-- Right vertical line -->
    <line x1="180" y1="40" x2="180" y2="160" stroke="#4F46E5" strokeWidth="14" strokeLinecap="round" strokeLinejoin="round" />
  </g>
  
  <!-- Scale/Law symbol - representing Legal AI -->
  <g transform="translate(128, 200)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#D4AF37" strokeWidth="2" opacity="0.6" />
    <!-- Scales -->
    <path d="M-12 -2 L-4 4 M0 -4 L0 4 M4 4 L12 -2" stroke="#D4AF37" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" />
  </g>
  
  <!-- NYTRIX Text -->
  <text x="128" y="235" fontFamily="Arial, sans-serif" fontSize="32" fontWeight="700" fill="url(#nytrixTextGrad)" textAnchor="middle" letterSpacing="2">
    NYTRIX
  </text>
</svg>